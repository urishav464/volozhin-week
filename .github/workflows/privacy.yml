name: privacy

# No path filter: docs are exactly where a phone number would slip in.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: No phones, private e-mails or keys in tracked files
        run: node scripts/pii-scan.mjs
      - name: No secrets anywhere in history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
